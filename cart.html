<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Корзина покупок Team Store." />
        <title>Корзина | Team Store</title>
        <link rel="stylesheet" href="./bootstrap.min.css" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body class="overflow-y-scroll">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container">
                    <a class="navbar-brand fw-semibold" href="./index.html">Team Store</a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="./index.html">О нас</a>
                        <a class="nav-link" href="./catalog.html">Каталог</a>
                        <a class="nav-link active" aria-current="page" href="./cart.html">
                            Корзина
                            <span class="badge rounded-pill bg-light text-primary ms-1" data-cart-count hidden></span>
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-5">
            <div class="mb-4">
                <p class="text-primary fw-semibold mb-2">Team Store</p>
                <h1 class="display-5 fw-bold">Корзина</h1>
                <p class="text-secondary mb-0">Здесь будут собраны выбранные вами товары.</p>
            </div>

            <section id="cart-items" aria-label="Товары в корзине">
                <div class="cart-empty card text-center">
                    <div class="card-body py-5 px-4">
                        <h2 class="h4 card-title">Корзина пока пуста</h2>
                        <p class="card-text text-secondary mb-4">
                            Перейдите в каталог, чтобы выбрать товары для покупки.
                        </p>
                        <a class="btn btn-primary" href="./catalog.html">Перейти в каталог</a>
                    </div>
                </div>
            </section>
            <section class="cart-summary mt-4" aria-labelledby="cart-total-heading">
                <h2 id="cart-total-heading" class="h5">Стоимость заказа</h2>
                <div id="cart-total" aria-live="polite"></div>
            </section>
            <form id="promo-form" class="mt-4">
                <label class="form-label" for="promo-code">Промокод</label>
                <div class="input-group">
                    <input class="form-control" id="promo-code" name="promo-code" autocomplete="off" />
                    <button class="btn btn-outline-primary" type="submit">Применить</button>
                </div>
            </form>
            <p id="promo-status" class="mt-2" role="status" aria-live="polite"></p>
            <p id="cart-status" class="text-danger mt-3" role="alert"></p>
        </main>

        <footer class="border-top py-4">
            <div class="container text-center text-secondary">
                <small>Team Store · учебный проект командной разработки</small>
            </div>
        </footer>
        <script type="module" src="./cart-page.js"></script>
    </body>
</html>
