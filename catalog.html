<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Каталог товаров Team Store." />
        <title>Каталог | Team Store</title>
        <link rel="stylesheet" href="./bootstrap.min.css" />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
                <div class="container">
                    <a class="navbar-brand fw-semibold" href="./index.html">Team Store</a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="./index.html">О нас</a>
                        <a class="nav-link active" aria-current="page" href="./catalog.html">Каталог</a>
                        <a class="nav-link" href="./cart.html">
                            Корзина
                            <span class="badge rounded-pill bg-light text-primary ms-1" data-cart-count hidden></span>
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-5">
            <div class="mb-4">
                <p class="text-primary fw-semibold mb-2">Team Store</p>
                <h1 class="display-5 fw-bold">Каталог товаров</h1>
                <p class="text-secondary mb-0">Найдите нужные товары по названию или категории.</p>
            </div>

            <section class="row g-3 mb-4" aria-label="Поиск и фильтрация каталога">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="search">Поиск по названию</label>
                    <input
                        class="form-control"
                        id="search"
                        type="search"
                        placeholder="Например, книга"
                        autocomplete="off"
                    />
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="category">Категория</label>
                    <select class="form-select" id="category">
                        <option value="all">Все категории</option>
                        <option value="electronics">Электроника</option>
                        <option value="books">Книги</option>
                        <option value="home">Дом</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="sort">Сортировка</label>
                    <select class="form-select" id="sort">
                        <option value="asc">Сначала дешевле</option>
                        <option value="desc">Сначала дороже</option>
                    </select>
                </div>
            </section>

            <p id="catalog-status" class="text-secondary" role="status" aria-live="polite"></p>
            <p id="cart-status" class="text-success" role="status" aria-live="polite"></p>
            <section
                id="catalog"
                class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
                aria-label="Товары магазина"
            ></section>
        </main>

        <footer class="border-top py-4">
            <div class="container text-center text-secondary">
                <small>Team Store · учебный проект командной разработки</small>
            </div>
        </footer>

        <script type="module" src="./catalog-page.js"></script>
    </body>
</html>
